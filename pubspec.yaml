name: tapnode_test
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  gap: ^3.0.1
  drift: ^2.34.3
  get_it: ^9.2.1
  logger: ^2.7.0
  equatable: ^2.1.0
  injectable: ^3.0.0
  auto_route: ^11.1.0
  flutter_svg: ^2.3.0
  flutter_bloc: ^9.1.1
  flutter_gen: ^5.15.0
  drift_flutter: ^0.3.1
  cupertino_icons: ^1.0.9
  flutter_animate: ^4.5.2
  json_annotation: ^4.12.0
  easy_localization: ^3.0.8
  freezed_annotation: ^3.1.0
  liquid_glass_widgets: ^0.29.2
  theme_tailor_annotation: ^3.1.3
  cunning_document_scanner: ^2.8.0
  assorted_layout_widgets: ^12.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  drift_dev: ^2.34.0
  theme_tailor: ^3.1.3
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  flutter_gen_runner: ^5.15.0
  injectable_generator: ^3.0.2
  auto_route_generator: ^10.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/launcher/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: SF Pro
      fonts:
        - asset: assets/fonts/SF-Pro.ttf

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
